name: 'update'
author: '11notes'
description: 'This action will check if a container image needs and update'
branding:
  icon: 'book-open'
  color: 'blue'
inputs:
  latest:
    description: 'latest semver of app'
    required: true
  build:
    description: 'latest build of app'
    required: false
  force:
    description: 'force update'
    required: false
runs:
  using: 'node24'
  main: 'dist/index.js'