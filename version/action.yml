description: 'This action will build the version from input'
branding:
  icon: 'book-open'
  color: 'blue'
inputs:
  version:
    description: 'semver to build'
    required: true
  etc:
    description: 'JSON string of additional properties to be added to BASE64'
    required: false
runs:
  using: 'node24'
  main: 'dist/index.js'